<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Indo Math{% endblock %}</title>
<script>
  // Apply the saved or system theme before paint to avoid a flash.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    var dark = saved ? saved === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<link rel="preload" href="/static/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/style.css">
{% block head %}{% endblock %}
</head>
<body class="is-{{ page }}">

<a class="skip-link" href="#main">Langsung ke isi</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="wordmark" href="/">Indo Math</a>

    <nav class="site-nav" aria-label="Menu utama">
      <a href="/" {% if page == "solve" %}aria-current="page"{% endif %}>Hitung</a>
      <a href="/banyak-soal" {% if page == "batch" %}aria-current="page"{% endif %}>Banyak soal</a>
      <a href="/tentang" {% if page == "about" %}aria-current="page"{% endif %}>Tentang model</a>
    </nav>

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Ganti ke mode gelap">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="main" class="page {% block page_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p>Model AI dapat salah hitung. Periksa kembali jawaban yang penting.</p>
</footer>

<script src="/static/js/theme.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
